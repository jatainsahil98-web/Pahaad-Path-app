plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pahaadpath.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.pahaadpath.app'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '2.0'
    }
    signingConfigs {
        // CI signs with the team key when the ANDROID_KEYSTORE secrets are set; otherwise with a throwaway debug key
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    // offline map tiles (assets/tiles): terrain PNGs are already compressed, so they are stored as they are; the vector
    // tiles (.pbf) are left to zip compression (about 3x smaller APK), which AssetManager undoes transparently
    androidResources {
        noCompress 'png'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}

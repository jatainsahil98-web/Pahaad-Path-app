name: emulator test
# Installs the published signed APK on an Android emulator and drives it (tests/emulator). Screenshots and results go to the emulator-results branch.
on:
  push:
    paths: ['tests/emulator/**', '.github/workflows/emulator.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save ws@8.18.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/emulator/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-results
          path: emu-out
      - name: Results to the emulator-results branch
        if: always()
        run: |
          D=run-${{ github.run_number }}
          mkdir -p /tmp/r/$D && cp -r emu-out/. /tmp/r/$D/
          cd /tmp/r && git init -q && git checkout -q -b emulator-results
          git config user.name github-actions && git config user.email actions@github.com
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch -q origin emulator-results && git reset -q origin/emulator-results || true
          git add $D && git commit -qm "emulator run $D" && git push -q origin emulator-results

/* ---------- my trips: saved trips are re-scored on every forecast update, so a change shows up without planning again ---------- */
const MT_MAX=5;
let MY=lsGet('pp_trips',[]);if(!Array.isArray(MY))MY=[];
function mtKey(x){return x.from+'|'+x.to+'|'+x.date;}
function mtCur(){return{from:st.from,to:st.to,date:st.date,dep:st.dep};}
function mtSaved(){const k=mtKey(mtCur());return MY.some(x=>mtKey(x)===k);}
function mtPrune(){const today=dayOf(st.nowMs);const n=MY.length;MY=MY.filter(x=>{const d=parseDate(x.date);return d!=null&&d>=today&&NODE(x.from)&&NODE(x.to);});if(MY.length!==n)lsSet('pp_trips',MY);}
const mtMemo=new Map();
/* plans a saved trip with the same engine as the screen, then puts the screen's trip back */
function mtRisk(x){
  const key=mtKey(x)+'|'+x.dep+'|'+st.hour0+'|'+st.src+'|'+st.scn+'|'+st.engine+'|'+odVer+'|'+ctx().reports.length;
  if(mtMemo.has(key))return mtMemo.get(key);
  const keep={from:st.from,to:st.to,date:st.date,dateIdx:st.dateIdx,dep:st.dep,pick:st.pick};
  let out=null;
  try{
    st.from=x.from;st.to=x.to;st.date=x.date;st.dateIdx=parseDate(x.date);st.dep=x.dep;st.pick=null;
    const M=compute();
    if(M.plans&&M.plans.length)out={score:M.cur.score,level:M.cur.level,hill:M.cur.hasHill,ms:M.slots[M.k].ms};
  }catch(e){out=null;}
  Object.assign(st,keep);
  if(mtMemo.size>50)mtMemo.clear();
  mtMemo.set(key,out);return out;
}
function mtLabel(level,score,hill){return hill?t(LV[level])+' '+score:t('plains');}

/* ---------- where am I: GPS works with no mobile data, so the trip screen can say what lies ahead ---------- */
let LASTPOS=null; // last fix, attached to a road report made within 15 minutes
/* GPS first; if it gives nothing (approximate location only, or no sky), the coarse network fix; a hard stop so the screen never hangs */
function locate(ok,fail){
  if(!navigator.geolocation){fail('none');return;}
  if(window.PPAndroid&&window.PPAndroid.locationEnabled&&!window.PPAndroid.locationEnabled()){fail('off');return;}
  let done=false;
  const fin=(f,x)=>{if(done)return;done=true;clearTimeout(guard);f(x);};
  const got=p=>{const pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};pos.near=tripNearTown(pos);LASTPOS=Object.assign({at:Date.now()},pos);fin(ok,pos);};
  const guard=setTimeout(()=>fin(fail,'timeout'),locGuard());
  navigator.geolocation.getCurrentPosition(got,e=>{
    if(done)return;
    if(e&&e.code===1){fin(fail,'denied');return;}
    navigator.geolocation.getCurrentPosition(got,()=>fin(fail,'nofix'),{enableHighAccuracy:false,timeout:locTry(),maximumAge:600000});
  },{enableHighAccuracy:true,timeout:locTry(),maximumAge:120000});
}
const locTry=()=>window.__fastSleep?300:15000,locGuard=()=>window.__fastSleep?1500:35000; // tests shorten the waits
function kmBetween(a,b,c,d){const kx=111.32*Math.cos(a*Math.PI/180);return Math.hypot((d-b)*kx,(c-a)*110.57);}
function tripNearTown(pos){
  const M=st.M;if(!M||!M.cur)return null;let best=null,bd=1e9;
  M.cur.nodes.forEach(id=>{const n=NODE(id);if(!n||n.virtual)return;const d=kmBetween(pos.lat,pos.lon,n.lat,n.lon);if(d<bd){bd=d;best=id;}});
  return best;
}
/* position along the trip: the closest stretch, and how far along it (km), from the stretch's road shape */
function whereOnTrip(lat,lon,cur){
  let best=null;
  cur.rows.forEach((r,i)=>{
    let g=geomOf(r.seg);if(r.rev)g=g.slice().reverse();
    const d=distToLine(lat,lon,g);
    if(!best||d<best.d){
      let tot=0,at=0,bd=1e9;const cum=[0];
      for(let j=1;j<g.length;j++){tot+=kmBetween(g[j-1][0],g[j-1][1],g[j][0],g[j][1]);cum.push(tot);}
      g.forEach((p,j)=>{const x=kmBetween(lat,lon,p[0],p[1]);if(x<bd){bd=x;at=cum[j];}});
      best={i,d,r,frac:tot?at/tot:0};
    }
  });
  return best;
}
function whereHtml(pos){
  const M=st.M,cur=M.cur,w=whereOnTrip(pos.lat,pos.lon,cur);if(!w)return '';
  const out=[];
  if(w.d>5){out.push(fill(t('wh_off'),{km:Math.round(w.d),p:pname(pos.near)}));return out.map(x=>'<p>'+esc(x)+'</p>').join('');}
  const r=w.r,kmHere=r.kmStart+r.seg.km*w.frac,nowH=(Date.now()-st.hour0)/3600e3;
  out.push(fill(t(r.seg.km*w.frac<1?'wh_at':'wh_on'),{r:pname(r.from)+' → '+pname(r.to),p:pname(r.from),km:Math.round(r.seg.km*w.frac)}));
  const nr=st.src==='none';
  if(!r.seg.plain&&!nr){const s=evalEdge(r.seg,r.rev,nowH,ctx()).score;out.push(fill(t('wh_now'),{l:t(LV[lvl(s)])+' '+s}));}
  const next=cur.rows.slice(w.i+1).find(x=>!x.seg.plain&&lvl(x.score)>0);
  if(!nr)out.push(next?fill(t('wh_next'),{r:pname(next.from)+' → '+pname(next.to),l:t(LV[lvl(next.score)])+' '+next.score,km:Math.max(0,Math.round(next.kmStart-kmHere))}):t('wh_clear'));
  const stay=cur.rows.slice(w.i).find(x=>NODE(x.to).stay&&!NODE(x.to).virtual&&x.to!==M.trip.to);
  if(stay)out.push(fill(t('wh_stay'),{p:pname(stay.to),km:Math.max(0,Math.round(stay.kmStart+stay.seg.km-kmHere))}));
  if(STOPS)['fuel','hosp'].forEach(k=>{const n=tripTowns(cur).find(x=>x.km>kmHere&&hasStop(x.id,k));if(n)out.push(fill(t('wh_'+k),{p:pname(n.id),km:Math.round(n.km-kmHere)}));});
  out.push(fill(t('wh_left'),{p:pname(M.trip.to),km:Math.max(0,Math.round(cur.totalKm-kmHere))}));
  return out.map(x=>'<p>'+esc(x)+'</p>').join('');
}

const ST_KINDS=['fuel','hosp','atm','mech'];
function stopsAt(id){return STOPS&&STOPS.towns[id]||null;}
function hasStop(id,k){const s=stopsAt(id);return !!(s&&s[k]&&s[k][0]);}
/* towns along the trip with the km at which the trip reaches them */
function tripTowns(cur){
  const out=[];if(!cur.rows.length)return out;
  out.push({id:cur.rows[0].from,km:0});
  cur.rows.forEach(r=>out.push({id:r.to,km:r.kmStart+r.seg.km}));
  return out.filter(x=>NODE(x.id)&&!NODE(x.id).virtual);
}
function fuelGap(cur){
  const tw=tripTowns(cur).filter(x=>hasStop(x.id,'fuel'));let best=null;
  for(let i=1;i<tw.length;i++){const g=tw[i].km-tw[i-1].km;if(!best||g>best.km)best={km:g,a:tw[i-1].id,b:tw[i].id};}
  const last=tripTowns(cur).slice(-1)[0];
  if(tw.length&&last&&last.km-tw[tw.length-1].km>(best?best.km:0))best={km:last.km-tw[tw.length-1].km,a:tw[tw.length-1].id,b:last.id};
  return best&&best.km>=40?best:null;
}

/* ---------- Android bridge (absent on the website) ---------- */
const AND=window.PPAndroid||null;
const andHas=m=>!!(AND&&typeof AND[m]==='function');
window.ppNoApp=()=>toast(t('no_app'));

/* WhatsApp: the app itself inside Android (wa.me would open a browser), wa.me on the web; copy the text when neither works */
function waOpen(text){
  if(andHas('openWhatsApp')){if(!AND.openWhatsApp(text)){copyText(text);toast(t('wa_none'));}return;}
  const w=window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');if(!w)copyText(text);
}
/* the phone's own share sheet: Android app, or the browser's Web Share; WhatsApp link otherwise */
function shareTextOut(text){
  if(andHas('shareText')){AND.shareText(text);return;}
  if(navigator.share){navigator.share({text}).catch(()=>{});return;}
  waOpen(text);
}

/* ---------- SOS: call 112, or SMS the position from the phone itself; WhatsApp only as an extra ---------- */
let sosPos=null,sosBusy=false;
function sosBody(){
  const M=st.M,trip=M&&M.cur?fill(t('sos_trip'),{r:titleOf(M)}):'';
  if(sosPos&&sosPos.lat!=null)return fill(t('sf_sos_msg'),{u:'https://maps.google.com/?q='+sosPos.lat.toFixed(5)+','+sosPos.lon.toFixed(5),a:Math.round(sosPos.acc)})+trip;
  const near=M&&M.cur?pname(M.trip.from):'';
  return fill(t('sos_msg0'),{p:near})+trip;
}
function sosStatus(){return sosBusy?t('sos_wait'):sosPos&&sosPos.lat!=null?fill(t('sos_got'),{m:Math.round(sosPos.acc)}):t('sos_none');}
function sosPaint(){const a=$('sos-st'),b=$('sos-prev');if(a)a.textContent=sosStatus();if(b)b.textContent=sosBody();}
function sos(){
  sosPos=null;sosBusy=true;
  openModal('<h3>'+t('sos_t')+'</h3><p class="note">'+t('sos_s')+'</p>'
    +'<div class="acts in"><a class="btn pri sos" id="sos-call" href="tel:112">'+t('sos_call')+'</a></div>'

    +'<p class="note" id="sos-st" role="status">'+esc(sosStatus())+'</p><p class="mono" id="sos-prev">'+esc(sosBody())+'</p>'
    +'<div class="acts in"><a class="btn pri" id="sos-sms" href="#">'+t('sos_sms')+'</a><button class="btn" id="sos-wa" type="button">'+t('sos_wa')+'</button></div>');

/* ---------- back button: close a window, then go back to the trip, then to the route tab; only then leave the app ---------- */
function goBack(){
  if(!$('modal').hidden){closeModal();return true;}
  if(st.view!=='trip'){st.view='trip';render();window.scrollTo(0,0);return true;}
  if(st.tab!=='route'){st.tab='route';render();return true;}
  return false;
}
/* the website gets the same behaviour from the browser's back button */
if(!AND&&window.history&&history.pushState){
  try{history.replaceState({pp:0},'');history.pushState({pp:1},'');}catch(e){}
  window.addEventListener('popstate',()=>{if(goBack()){try{history.pushState({pp:1},'');}catch(e){}}else history.back();});
}

/* ---------- keep the trip when the phone closes the app in the background ---------- */
const LAST_KEYS=['from','to','dep','tab','view','pick'];
function saveLast(){
  if(st.src==='replay'||String(st.scn).startsWith('rp:'))return;
  if(!N[st.from]||!N[st.to]||N[st.from].virtual||N[st.to].virtual)return;
  const o={date:st.dateIdx};LAST_KEYS.forEach(k=>{o[k]=st[k];});lsSet('pp_last',o);
}
(function restoreLast(){
  if(['from','to','date','view','tab','dep','pick'].some(k=>q.get(k)!=null))return; // a shared link wins
  const o=lsGet('pp_last',null);if(!o||typeof o!=='object')return;
  if(N[o.from]&&N[o.to]&&o.from!==o.to){st.from=o.from;st.to=o.to;}
  if(['route','map','reports','rules','safety'].includes(o.tab))st.tab=o.tab;
  if(['trip','ops','proof'].includes(o.view))st.view=o.view;
  if(o.dep==null||(o.dep>=0&&o.dep<24))st.dep=o.dep==null?null:+o.dep;
  if(['fast','safe','alt'].includes(o.pick))st.pick=o.pick;
  if(+o.date>0){st.dateIdx=+o.date;st.dateInit=1;} // clampDate() still keeps it between today and the last forecast day
})();
const renderBase8=render;
render=function(){renderBase8();saveLast();navBox();};

/* ---------- hand-off to a navigation app, keeping PahaadPath's route ---------- */
const ll5=n=>n.lat.toFixed(5)+','+n.lon.toFixed(5);
function navStops(M){
  const ids=M.cur.nodes.filter(id=>{const n=NODE(id);return n&&n.lat!=null;});
  if(ids.length<2)return null;
  const from=NODE(ids[0]),to=NODE(ids.at(-1)),mid=ids.slice(1,-1).filter(id=>!NODE(id).virtual);
  const via=[];if(mid.length){const k=Math.min(3,mid.length);for(let i=1;i<=k;i++)via.push(NODE(mid.at(Math.round(i*(mid.length+1)/(k+1))-1)));}
  return {from,to,via:via.filter((v,i,a)=>a.indexOf(v)===i)};
}
function googleNavUrl(s){
  return 'https://www.google.com/maps/dir/?api=1&origin='+ll5(s.from)+'&destination='+ll5(s.to)
    +(s.via.length?'&waypoints='+encodeURIComponent(s.via.map(ll5).join('|')):'')+'&travelmode=driving';
}
function mapplsNavUrl(s){
  return 'https://mappls.com/direction?places='+[s.from,...s.via,s.to].map(n=>encodeURIComponent(ll5(n)+','+n.en)).join(';');
}
function navBox(){
  let box=$('navbox');
  const M=st.M,show=st.view==='trip'&&st.tab==='route'&&M&&M.cur&&st.src!=='replay';
  const s=show?navStops(M):null;
  if(!s){if(box)box.hidden=true;return;}
  if(!box){box=document.createElement('div');box.id='navbox';box.className='navbox';$('acts').after(box);}
  box.hidden=false;
  box.innerHTML='<p class="note"><b>'+t('nav_t')+'.</b> '+esc(fill(t('nav_s'),{v:s.via.length?s.via.map(n=>nm(n)).join(', '):pname(M.trip.to)}))+'</p>'
    +'<div class="acts in"><a class="btn" id="nav-g" href="'+esc(googleNavUrl(s))+'" target="_blank" rel="noopener">'+t('nav_g')+'</a>'
    +'<a class="btn" id="nav-m" href="'+esc(mapplsNavUrl(s))+'" target="_blank" rel="noopener">'+t('nav_m')+'</a></div>';
}
document.addEventListener('click',e=>{if(e.target.closest('#nav-g,#nav-m')&&navigator.onLine===false)toast(t('nav_off'));});

/* test hook: how many stretches a Leaflet map draws (the canvas renderer leaves no SVG paths to count) */
function mapLines(id){const o=LM[id];if(!o)return 0;let n=0;o.map.eachLayer(l=>{if(l instanceof L.Polyline&&l.options.interactive!==false)n++;});return n;}

ne (1980) की वैश्विक सीमा। सड़कों का नक्शा लगभग 60 जगहों और 75 सड़कों से हाथ से बनाया है और दूरियाँ अनुमानित हैं। नीचे की डेटा पंक्ति बताती है कि इस कॉपी में दूरी, ढलान और घटनाओं के कौन से मान हैं। ट्रैफ़िक कैलेंडर पर आधारित अनुमान है और इसके गुणांक नमूने हैं; API कुंजी मिलने पर लाइव ट्रैफ़िक (Google, TomTom, HERE, Mappls) जोड़ा जा सकता है। एक हफ़्ते से आगे का मौसम पूर्वानुमान नहीं, मोटा अनुमान है।"}},Vt={hill:{tag:"chk",srcs:[["https://www.livelaw.in/amp/consumer-cases/no-compensation-for-mountain-accidents-without-hill-endorsement-on-driving-license-uttarakhand-commission-clears-national-insurance-companys-liability-236352","LiveLaw · State Commission, case A/159/2022, 28 Aug 2023"]],en:{h:"Hill-road driving endorsement",b:"Hill roads may need a hill endorsement on the driving licence. In 2023 Uttarakhand’s State Consumer Commission rejected an insurance claim for a hill accident because the driver’s licence had no hill endorsement. Ask your RTO or insurer whether your vehicle type needs one."},hi:{h:"पहाड़ी सड़क के लिए लाइसेंस पर हिल एंडोर्समेंट",b:"पहाड़ी सड़कों के लिए ड्राइविंग लाइसेंस पर “हिल एंडोर्समेंट” ज़रूरी हो सकता है। 2023 में उत्तराखंड राज्य उपभोक्ता आयोग ने पहाड़ी दुर्घटना का बीमा दावा इसलिए ख़ारिज किया कि चालक के लाइसेंस पर हिल एंडोर्समेंट नहीं था। अपने आरटीओ या बीमा कंपनी से पूछ लें कि आपके वाहन के लिए यह चाहिए या नहीं।"}},yatra:{tag:"req",srcs:[["https://registrationandtouristcare.uk.gov.in/faq.php","Tourist Care Uttarakhand, official FAQ"]],en:{h:"Char Dham yatra registration",b:"Registration for the Char Dham and Hemkund Sahib yatra is mandatory. You get a QR code. If you travel by your own vehicle, you upload its details. Register on the official Tourist Care Uttarakhand portal before you start."},hi:{h:"चारधाम यात्रा पंजीकरण",b:"चारधाम और हेमकुंड साहिब यात्रा के लिए पंजीकरण अनिवार्य है। पंजीकरण पर क्यूआर कोड मिलता है और अपने वाहन से जा रहे हों तो वाहन का ब्योरा भी अपलोड करना होता है। निकलने से पहले उत्तराखंड के आधिकारिक टूरिस्ट केयर पोर्टल पर पंजीकरण करें।"}},vehicle:{tag:"chk",srcs:[["https://cdn.triptotemples.com/news/char-dham/chardham-yatra-new-transport-rules-to-end-long-queues-at-checkposts","Trip to Temples, news report on the 2026 yatra"],["https://www.outlooktraveller.com/amp/story/News/char-dham-yatra-2026-new-rules-registration-and-safety-guidelines-explained","Outlook Traveller, Char Dham Yatra 2026 rules"]],en:{h:"Vehicle papers and hill endorsement for Char Dham, 2026",b:"Reports on the 2026 yatra describe a Green Card and a per-trip Trip Card for passenger vehicles, checked by officers with handheld devices, a hill endorsement for every driver and limits on very long vehicles on narrow stretches. The papers differ for commercial and private vehicles and the reports are not official, so confirm on the state transport portal before you go."},hi:{h:"चारधाम 2026 के लिए वाहन के काग़ज़ और हिल एंडोर्समेंट",b:"2026 की यात्रा पर आई रिपोर्टें यात्री वाहनों के लिए ग्रीन कार्ड और हर यात्रा का ट्रिप कार्ड बताती हैं, जिसे अधिकारी हाथ के उपकरणों से जाँचते हैं; हर चालक के लिए हिल एंडोर्समेंट; और तंग हिस्सों पर बहुत लंबे वाहनों पर रोक। व्यावसायिक और निजी वाहनों के काग़ज़ अलग हैं और ये रिपोर्टें आधिकारिक नहीं हैं, इसलिए निकलने से पहले राज्य के परिवहन पोर्टल पर पुष्टि कर लें।"}},season:{tag:"chk",srcs:[["https://www.newsonair.gov.in/uttarakhand-announces-winter-closing-dates-for-kedarnath-badrinath-gangotri-and-yamunotri-temples/","All India Radio, 2 Oct 2025"],["https://www.newsonair.gov.in/badrinath-temple-portals-to-close-today-concluding-this-years-char-dham-yatra","All India Radio, 25 Nov 2025"]],en:{h:"The shrines close for winter",b:"Closing dates are announced each year on Vijayadashami. In 2025 Gangotri closed on 22 October, Kedarnath and Yamunotri on 23 October (Bhai Dooj) and Badrinath on 25 November. Expect a similar pattern after Diwali in 2026. Confirm the dates before you plan a trip in late October or November. Snow can also shut the roads beyond."},hi:{h:"धाम सर्दियों में बंद हो जाते हैं",b:"बंद होने की तारीख़ें हर साल विजयादशमी पर घोषित होती हैं। 2025 में गंगोत्री 22 अक्तूबर को, केदारनाथ और यमुनोत्री 23 अक्तूबर (भैया दूज) को और बद्रीनाथ 25 नवंबर को बंद हुए। 2026 में भी दीपावली के बाद ऐसा ही क्रम मानें और अक्तूबर के अंत या नवंबर की यात्रा तय करने से पहले तारीख़ें पक्की कर लें। बर्फ़ से आगे की सड़कें भी बंद हो सकती हैं।"}},mus:{tag:"req",srcs:[["https://www.outlooktraveller.com/News/to-visit-mussoorie-this-season-youll-need-to-register-first-heres-why","Outlook Traveller, on the Mussoorie registration from 1 Aug 2025"]],en:{h:"Mussoorie tourist registration",b:"Since 1 August 2025 visitors register online (vehicle number, passengers, dates, stay) on the Dehradun Smart City portal. It is checked at the Kincraig and Picture Palace entry points. It is free and no cap on visitors was reported. The aim is to manage crowds and traffic. Check that it is still in force before you go."},hi:{h:"मसूरी पर्यटक पंजीकरण",b:"1 अगस्त 2025 से आने वाले पर्यटक देहरादून स्मार्ट सिटी पोर्टल पर ऑनलाइन पंजीकरण करते हैं (वाहन नंबर, यात्री, तारीख़ें, ठहराव)। जाँच किनक्रेग और पिक्चर पैलेस के प्रवेश बिंदुओं पर होती है। यह निःशुल्क है और आगंतुकों की कोई सीमा नहीं बताई गई थी। उद्देश्य भीड़ और ट्रैफ़िक सँभालना है। निकलने से पहले देख लें कि यह अब भी लागू है।"}},gau:{tag:"trk",srcs:[["https://www.incredibleindia.gov.in/en/uttarakhand/uttarkashi/gangotri-national-park","Incredible India, Gangotri National Park"]],en:{h:"Gaumukh trek permit",b:"Permits for the Gaumukh trail are capped at 150 visitors a day. Get them online or at the forest offices in Uttarkashi or Gangotri. A registered guide is required for treks beyond Gaumukh, such as Tapovan or Nelong."},hi:{h:"गौमुख ट्रेक परमिट",b:"गौमुख मार्ग के परमिट रोज़ाना 150 लोगों तक सीमित हैं। ये ऑनलाइन या उत्तरकाशी और गंगोत्री के वन कार्यालयों से मिलते हैं। गौमुख से आगे, जैसे तपोवन या नेलांग, के लिए पंजीकृत गाइड ज़रूरी है।"}},hours:{tag:"info",srcs:[["https://www.dailypioneer.com/2022/state-editions/drivers-welcome-extended-time-for-driving-on <div class="app shell" id="app">
  <!-- the route map fills the screen behind everything on the trip view (src/shell.js) -->
  <div class="bgmap" id="bgmap" role="region" aria-label="Route map"></div>

  <header class="mast topbar">
    <div class="mast-row">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="8" fill="#F2B705"/>
        <path d="M3 33 L15 12 L21 22 L26 15 L37 33 Z" fill="#14221C"/>
        <path d="M15 12 L18 17.2 L15 15.4 L12.4 17.2 Z" fill="#F2B705"/>
        <path d="M8 36 Q20 28 32 36" fill="none" stroke="#F2B705" stroke-width="2.4" stroke-dasharray="4 3"/>
      </svg>
      <div class="brand"><b>PahaadPath</b><span id="tag"></span></div>
      <button class="qsum" id="qsum" type="button" aria-controls="search" aria-expanded="false"></button>
      <div class="spacer"></div>
      <div class="lang" role="group" aria-label="Language">
        <button id="b-en" aria-pressed="true" type="button">EN</button>
        <button id="b-hi" aria-pressed="false" type="button" lang="hi">हिं</button>
      </div>
    </div>
    <button class="srcchip" id="srcchip" type="button" aria-controls="conds" aria-expanded="false"><span class="dot" id="dot"></span><span id="srcmsg"></span></button>
  </header>
  <div class="stripe"></div>

  <!-- forecast and traffic settings, opened from the status line -->
  <div class="src conds" id="conds" hidden>
    <label class="sel"><span id="lw"></span>
      <select id="scn"><option value="monsoon"></option><option value="clear"></option><option value="live"></option></select></label>
    <label class="sel"><span id="lt"></span>
      <select id="tday"><option value="cal"></option><option value="normal"></option><option value="weekend"></option><option value="leve"></option><option value="lstart"></option><option value="lend"></option></select></label>
  </div>

  <!-- trip search: slides down from the summary in the top bar -->
  <div class="search" id="search">
  <section class="trip" id="trip" aria-label="Trip">
    <div class="ask" id="ask">
      <input id="in-ask" type="text" autocomplete="off" spellcheck="false" enterkeyhint="go">
      <button class="mic" id="b-mic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <div class="rin">
      <label class="fld"><span id="l-from"></span><input id="in-from" type="text" list="places" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go"></label>
      <label class="fld"><span id="l-to"></span><input id="in-to" type="text" list="places" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go"></label>
      <button class="swap" id="swap" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
    </div>
    <div class="when">
      <label class="fld"><span id="l-date"></span><input id="in-date" type="date"></label>
      <label class="fld"><span id="l-dep"></span><select id="in-dep"></select></label>
    </div>
    <p class="dline" id="dline"></p>
    <p class="pmsg" id="pmsg" hidden></p>
    <div class="presets" id="presets"></div>
    <datalist id="places"></datalist>
    <button class="btn pri go" id="search-go" type="button"></button>
  </section>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <!-- quick actions over the map -->
  <div class="fabs fabs-top" id="fabs-top">
    <button class="fab" id="fab-layer" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <button class="fab" id="fab-fit" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="fabs" id="fabs">
    <button class="fab" id="fab-where" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
    <button class="fab sosfab" id="fab-sos" type="button">SOS</button>
  </div>

  <!-- results: a sheet over the map that drags between peek, half and full (a side panel on wide screens) -->
  <div id="v-trip" class="sheet" data-snap="half">
    <div class="grab" id="grab" role="button" tabindex="0"><span class="handle"></span></div>
    <div class="sheet-in" id="sheet-in">
      <section id="verdict"></section>
      <section class="routes" id="routes"></section>
      <section class="trf" id="traffic"></section>
      <div class="acts" id="acts"></div>
      <section class="card" id="planner"></section>
      <div class="tabs" role="tablist" id="tabs"></div>
      <section class="panel" id="panel"></section>
      <footer class="foot" id="foot"></footer>
    </div>
  </div>
  <section id="v-ops" class="wide-view" hidden></section>
  <section id="v-proof" class="wide-view" hidden></section>

  <nav class="views bnav" id="views" aria-label="Views"></nav>
</div>
<div class="modal" id="modal" hidden><div class="modal-in" role="dialog" aria-modal="true"><button class="x" id="modal-x" type="button" aria-label="Close">×</button><div id="modal-body"></div></div></div>
<div class="toast" id="toast" hidden></div>


</body></html>
